[package]
name = "cvm"
version = "0.0.1"
edition = "2021"
rust-version = "1.65"
license = "Apache-2.0"
description = "Compiler version manager for LLVM and GCC"
repository = "https://github.com/QGrain/cvm"
homepage = "https://github.com/QGrain/cvm"
readme = "README.md"
keywords = ["compiler", "llvm", "gcc", "version-manager"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "cvm"
path = "src/lib.rs"

[[bin]]
name = "cvm"
path = "src/main.rs"
