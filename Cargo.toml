[package]
name = "cvm"
version = "0.0.5"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Compiler version manager for LLVM and GCC"
repository = "https://github.com/QGrain/cvm"
homepage = "https://github.com/QGrain/cvm"
readme = "README.md"
keywords = ["compiler", "llvm", "gcc", "version-manager"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["proxy-from-env"] }

[lib]
name = "cvm"
path = "src/lib.rs"

[[bin]]
name = "cvm"
path = "src/main.rs"
