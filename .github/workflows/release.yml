name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

  build:
    needs: create-release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            asset: cvm-x86_64-unknown-linux-musl.tar.gz
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04
            asset: cvm-aarch64-unknown-linux-musl.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            asset: cvm-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            runner: macos-15
            asset: cvm-aarch64-apple-darwin.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install cross
        if: contains(matrix.target, 'linux-musl')
        run: |
          cargo install cross --locked

      - name: Build
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          if [[ "${{ matrix.target }}" == *linux-musl ]]; then
            cross build --locked --release --target "${{ matrix.target }}"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp "target/${{ matrix.target }}/release/cvm" dist/package/cvm
          tar -C dist/package -czf "dist/${{ matrix.asset }}" cvm

      - name: Install signing tools
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install gnupg
          fi

      - name: Import release signing key
        env:
          CVM_RELEASE_GPG_PRIVATE_KEY: ${{ secrets.CVM_RELEASE_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$CVM_RELEASE_GPG_PRIVATE_KEY"
          printf '%s' "$CVM_RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Sign release asset
        env:
          CVM_RELEASE_GPG_KEY_ID: ${{ secrets.CVM_RELEASE_GPG_KEY_ID }}
          CVM_RELEASE_GPG_PASSPHRASE: ${{ secrets.CVM_RELEASE_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$CVM_RELEASE_GPG_KEY_ID"
          test -n "$CVM_RELEASE_GPG_PASSPHRASE"
          gpg --batch --yes --detach-sign --armor \
            --pinentry-mode loopback \
            --passphrase "$CVM_RELEASE_GPG_PASSPHRASE" \
            --local-user "$CVM_RELEASE_GPG_KEY_ID" \
            --output "dist/${{ matrix.asset }}.sig" \
            "dist/${{ matrix.asset }}"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/${{ matrix.asset }}" \
            "dist/${{ matrix.asset }}.sig" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
