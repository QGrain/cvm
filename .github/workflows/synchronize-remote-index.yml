name: Synchronize remote index

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "37 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Synchronize compiler remote index
        run: python3 tools/update_remote_index.py --output manifests/remote-index.json

      - name: Validate compiler remote index
        run: |
          python3 -m unittest discover -s tests -p 'test_update_remote_index.py'
          python3 -m json.tool manifests/remote-index.json >/dev/null
          git diff --check

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: synchronize-compiler-remote-index
          commit-message: "Synchronize compiler remote index"
          title: "Synchronize compiler remote index"
          add-paths: manifests/remote-index.json
          body: |
            This PR synchronizes `manifests/remote-index.json` with upstream GCC and LLVM release metadata.

      - name: Enable automatic squash merge
        if: >-
          steps.cpr.outputs.pull-request-operation == 'created' ||
          steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --auto \
            --delete-branch \
            --match-head-commit "${{ steps.cpr.outputs.pull-request-head-sha }}"
