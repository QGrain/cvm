name: Synchronize remote index

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "37 3 1 * *"
  workflow_dispatch:

concurrency:
  group: synchronize-remote-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Synchronize compiler remote index
        run: python3 tools/update_remote_index.py --output manifests/remote-index.json

      - name: Validate compiler remote index
        run: |
          python3 -m unittest discover -s tests -p 'test_update_remote_index.py'
          python3 -m json.tool manifests/remote-index.json >/dev/null
          git diff --check
          git diff --exit-code -- . ':(exclude)manifests/remote-index.json'

      - name: Commit compiler remote index
        run: |
          if git diff --quiet -- manifests/remote-index.json; then
            echo "Compiler remote index is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/remote-index.json
          git diff --cached --check
          git commit -m "Synchronize compiler remote index"
          git push origin HEAD:main
